[package]
name = "coi-editor"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui-component = "=0.8.1"
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
